[workspace]
resolver = "2"
members = [
    "contracts/registry",
    "contracts/token",
    "contracts/craft_coin",
    "contracts/payment_processor",
    "contracts/gig_marketplace",
    "contracts/review_system",
    "contracts/chat_system",
]

[workspace.dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = true
debug-assertions = false
panic = "abort"
lto = "fat"
codegen-units = 1
